<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jewel India ERP — System Architecture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.09);
      padding: 32px 32px 24px;
      width: 100%;
      max-width: 1200px;
      height: fit-content;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
<div class="card">
<svg viewBox="0 0 1150 810" xmlns="http://www.w3.org/2000/svg"
     style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">

  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a9eed"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════ -->
  <!--  TITLE                                     -->
  <!-- ══════════════════════════════════════════ -->
  <text x="575" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">
    Jewel India ERP — System Architecture
  </text>

  <!-- ══════════════════════════════════════════ -->
  <!--  ZONE: STAFF & MANAGEMENT                  -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="30" y="48" width="1090" height="108" rx="10"
        fill="#dbe4ff" fill-opacity="0.55" stroke="#93c5fd" stroke-width="1"/>
  <text x="1110" y="68" text-anchor="end" font-size="12" fill="#3b82f6" font-style="italic">
    Who uses the system
  </text>

  <!-- Admin -->
  <rect x="50" y="62" width="135" height="62" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="117" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Admin</text>
  <text x="117" y="108" text-anchor="middle" font-size="11" fill="#1e40af">System setup</text>

  <!-- Sales Staff -->
  <rect x="215" y="62" width="135" height="62" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="282" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Sales Staff</text>
  <text x="282" y="108" text-anchor="middle" font-size="11" fill="#1e40af">Orders &amp; invoices</text>

  <!-- Accountant -->
  <rect x="380" y="62" width="135" height="62" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="447" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Accountant</text>
  <text x="447" y="108" text-anchor="middle" font-size="11" fill="#1e40af">Ledger &amp; finance</text>

  <!-- Manager -->
  <rect x="545" y="62" width="135" height="62" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="612" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Manager</text>
  <text x="612" y="108" text-anchor="middle" font-size="11" fill="#1e40af">Reports &amp; oversight</text>

  <!-- Store Owner -->
  <rect x="710" y="62" width="150" height="62" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="785" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Store Owner</text>
  <text x="785" y="108" text-anchor="middle" font-size="11" fill="#1e40af">Full access</text>

  <!-- ══════════════════════════════════════════ -->
  <!--  ARROW: Staff → Frontend                   -->
  <!-- ══════════════════════════════════════════ -->
  <line x1="575" y1="156" x2="575" y2="192" stroke="#4a9eed" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="582" y="179" font-size="12" fill="#4a9eed">Log in &amp; use</text>

  <!-- ══════════════════════════════════════════ -->
  <!--  FRONTEND (React Web App)                  -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="290" y="194" width="570" height="64" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text x="575" y="222" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">
    React Web App
  </text>
  <text x="575" y="244" text-anchor="middle" font-size="12" fill="#1e40af">
    The interface staff see in their browser — nothing to install
  </text>

  <!-- ══════════════════════════════════════════ -->
  <!--  ARROW: Frontend → Backend                 -->
  <!-- ══════════════════════════════════════════ -->
  <line x1="575" y1="258" x2="575" y2="292" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="582" y="280" font-size="12" fill="#7c3aed">Sends requests (HTTP)</text>

  <!-- ══════════════════════════════════════════ -->
  <!--  BACKEND (Django REST API)                 -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="120" y="294" width="670" height="64" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="455" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#3b0764">
    Django REST API — Backend Server
  </text>
  <text x="455" y="344" text-anchor="middle" font-size="12" fill="#5b21b6">
    The brain — processes every request, checks rules, and routes to the right module
  </text>

  <!-- ══════════════════════════════════════════ -->
  <!--  AI ASSISTANT                              -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="860" y="294" width="192" height="64" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
  <text x="956" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">AI Assistant</text>
  <text x="956" y="340" text-anchor="middle" font-size="12" fill="#92400e">Smart insights</text>

  <!-- Arrow: Backend → AI -->
  <line x1="790" y1="326" x2="857" y2="326" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- ══════════════════════════════════════════ -->
  <!--  ARROW: Backend → Modules                  -->
  <!-- ══════════════════════════════════════════ -->
  <line x1="575" y1="358" x2="575" y2="400" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="582" y="384" font-size="12" fill="#15803d">Routes to module</text>

  <!-- ══════════════════════════════════════════ -->
  <!--  ZONE: BUSINESS MODULES                    -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="30" y="402" width="1090" height="252" rx="10"
        fill="#d3f9d8" fill-opacity="0.55" stroke="#86efac" stroke-width="1"/>
  <text x="40" y="420" font-size="12" fill="#15803d" font-weight="600" font-style="italic">
    Business Modules — each one handles a specific part of the jewellery business
  </text>

  <!-- ── ROW 1 (y=428) ── -->

  <!-- Sales & Billing -->
  <rect x="45" y="428" width="183" height="62" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.5"/>
  <text x="136" y="454" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Sales &amp; Billing</text>
  <text x="136" y="473" text-anchor="middle" font-size="11" fill="#166534">Invoices, orders, RFID tags</text>

  <!-- Purchase -->
  <rect x="243" y="428" width="183" height="62" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.5"/>
  <text x="334" y="454" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Purchase</text>
  <text x="334" y="473" text-anchor="middle" font-size="11" fill="#166534">Supplier orders &amp; receipts</text>

  <!-- Inventory & Stock -->
  <rect x="441" y="428" width="183" height="62" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.5"/>
  <text x="532" y="454" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Inventory &amp; Stock</text>
  <text x="532" y="473" text-anchor="middle" font-size="11" fill="#166534">Items, packets, gold weight</text>

  <!-- Manufacturing -->
  <rect x="639" y="428" width="183" height="62" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.5"/>
  <text x="730" y="454" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Manufacturing</text>
  <text x="730" y="473" text-anchor="middle" font-size="11" fill="#166534">Production orders &amp; jobs</text>

  <!-- Accounting & Ledger -->
  <rect x="837" y="428" width="200" height="62" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.5"/>
  <text x="937" y="454" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Accounting &amp; Ledger</text>
  <text x="937" y="473" text-anchor="middle" font-size="11" fill="#166534">Journals, P&amp;L, balance sheet</text>

  <!-- ── ROW 2 (y=510) ── -->

  <!-- HR & Payroll -->
  <rect x="45" y="514" width="183" height="62" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.5"/>
  <text x="136" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">HR &amp; Payroll</text>
  <text x="136" y="559" text-anchor="middle" font-size="11" fill="#166534">Staff, attendance, salary</text>

  <!-- Gold Scheme -->
  <rect x="243" y="514" width="183" height="62" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.5"/>
  <text x="334" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Gold Scheme</text>
  <text x="334" y="559" text-anchor="middle" font-size="11" fill="#166534">Customer saving plans</text>

  <!-- Contacts (CRM) -->
  <rect x="441" y="514" width="183" height="62" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.5"/>
  <text x="532" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Contacts (CRM)</text>
  <text x="532" y="559" text-anchor="middle" font-size="11" fill="#166534">Customers, occasions, follow-up</text>

  <!-- Live Gold Rates -->
  <rect x="639" y="514" width="183" height="62" rx="8" fill="#fff3bf" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="730" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Live Gold Rates</text>
  <text x="730" y="559" text-anchor="middle" font-size="11" fill="#92400e">Real-time pricing feed</text>

  <!-- Settings & Config -->
  <rect x="837" y="514" width="200" height="62" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.5"/>
  <text x="937" y="540" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Settings &amp; Config</text>
  <text x="937" y="559" text-anchor="middle" font-size="11" fill="#166534">Company, branch, masters</text>

  <!-- ══════════════════════════════════════════ -->
  <!--  ARROW: Modules → Database                 -->
  <!-- ══════════════════════════════════════════ -->
  <line x1="575" y1="654" x2="575" y2="692" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="582" y="678" font-size="12" fill="#15803d">Read &amp; write data</text>

  <!-- ══════════════════════════════════════════ -->
  <!--  DATABASE                                  -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="285" y="694" width="580" height="64" rx="10" fill="#c3fae8" stroke="#22c55e" stroke-width="2"/>
  <text x="575" y="722" text-anchor="middle" font-size="16" font-weight="700" fill="#134e4a">
    Database (PostgreSQL)
  </text>
  <text x="575" y="743" text-anchor="middle" font-size="12" fill="#0f766e">
    All ERP data lives here — shared by every module above
  </text>

  <!-- ══════════════════════════════════════════ -->
  <!--  LEGEND                                    -->
  <!-- ══════════════════════════════════════════ -->
  <text x="30" y="784" font-size="12" fill="#6b7280" font-weight="600">Legend:</text>

  <rect x="88" y="772" width="14" height="14" rx="3" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5"/>
  <text x="108" y="784" font-size="12" fill="#6b7280">User interface</text>

  <rect x="210" y="772" width="14" height="14" rx="3" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="230" y="784" font-size="12" fill="#6b7280">Backend server</text>

  <rect x="340" y="772" width="14" height="14" rx="3" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.5"/>
  <text x="360" y="784" font-size="12" fill="#6b7280">Business module</text>

  <rect x="475" y="772" width="14" height="14" rx="3" fill="#c3fae8" stroke="#22c55e" stroke-width="1.5"/>
  <text x="495" y="784" font-size="12" fill="#6b7280">Database</text>

  <rect x="575" y="772" width="14" height="14" rx="3" fill="#ffd8a8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="595" y="784" font-size="12" fill="#6b7280">AI / live feed</text>

</svg>
</div>
</body>
</html>
