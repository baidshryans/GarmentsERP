{% for p in problems %}<div class="messages"><div class="message error">{{ p }}</div></div>{% endfor %}
<form method="get" class="field-row no-print" style="margin-bottom:16px;align-items:end">
  {% if mode == "range" %}
  <div class="field"><label for="from">From</label><input id="from" name="from" type="date" value="{{ date_from|date:'Y-m-d' }}"></div>
  <div class="field"><label for="to">To</label><input id="to" name="to" type="date" value="{{ date_to|date:'Y-m-d' }}"></div>
  {% else %}
  <div class="field"><label for="as_of">As at</label><input id="as_of" name="as_of" type="date" value="{{ as_of|date:'Y-m-d' }}"></div>
  {% endif %}
  {% if compare %}<input type="hidden" name="compare" value="1">{% endif %}{% if kind %}<input type="hidden" name="kind" value="{{ kind }}">{% endif %}{% if vtype %}<input type="hidden" name="type" value="{{ vtype }}">{% endif %}
  <div class="field report-actions"><button class="btn primary">Show</button><button class="btn icon" name="format" value="xlsx" title="Export to Excel" aria-label="Export to Excel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9.5 12.5l5 5M14.5 12.5l-5 5"/></svg></button><button type="button" class="btn icon" onclick="window.print()" title="Print / save as PDF" aria-label="Print / save as PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 16.5h7M8.5 13h4"/></svg></button></div>
</form>
