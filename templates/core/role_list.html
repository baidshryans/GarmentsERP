{% extends "base.html" %}
{% block title %}Roles{% endblock %}
{% block content %}
  <div class="page-head">
    <h1 class="page-title">Roles</h1>
    <div class="actions"><a class="btn primary" href="{% url 'role_create' %}"><svg width="16" height="16"><use href="#i-plus"/></svg> New role</a></div>
  </div>
  <div class="island">
    <div class="table-scroll"><table>
      <thead><tr><th scope="col">Role</th><th scope="col">What it is for</th><th scope="col" class="num">Users</th><th scope="col"></th></tr></thead>
      <tbody>{% for r in roles %}
        <tr><td><strong>{{ r.name }}</strong>{% if r.is_system %} <span class="pill">Standard</span>{% endif %}</td><td class="muted">{{ r.description }}</td><td class="num">{{ r.users.count }}</td><td><a href="{% url 'role_edit' r.pk %}">Permissions</a></td></tr>
      {% endfor %}</tbody>
    </table></div>
  </div>
{% endblock %}
