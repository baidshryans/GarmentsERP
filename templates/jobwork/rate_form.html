{% extends "base.html" %}
{% load static forms_ui %}
{% block title %}New rate{% endblock %}
{% block content %}
  <div class="page-head"><h1 class="page-title">New rate</h1></div>
  <form method="post" novalidate>{% csrf_token %}
    <div class="island"><div class="field-row">
      <div class="field"><label for="who">Who does it</label><select id="who" name="who"><option value="">Choose…</option><option value="inhouse" {% if d.who == "inhouse" %}selected{% endif %}>In-house (our own people)</option>{% for f in fabricators %}<option value="{{ f.pk }}" {% if d.who == f.pk|stringformat:"s" %}selected{% endif %}>{{ f.name }}</option>{% endfor %}</select></div>
      <div class="field"><label for="process">Process</label><select id="process" name="process"><option value="">Choose…</option>{% for p in processes %}<option value="{{ p.pk }}" {% if d.process == p.pk|stringformat:"s" %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></div>
      <div class="field"><label for="rate">Rate per piece</label><input id="rate" name="rate" type="text" inputmode="decimal" value="{{ d.rate }}"></div>
      <div class="field"><label for="effective_from">From</label><input id="effective_from" name="effective_from" type="date" value="{{ d.effective_from|default:today }}" required></div></div>
      <div class="field-row" {% show_when "who" d.who|default:"" fab_ids %}>
        <div class="field"><label for="pay_basis">Pay on</label><select id="pay_basis" name="pay_basis">{% for v, l in pay_bases %}<option value="{{ v }}" {% if pay_basis == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
          <span class="muted">Accepted: only pieces that pass QC are paid. Received: every piece that comes back is paid. A piece is never paid twice.</span></div></div>
    </div>
    <div class="form-actions"><button class="btn primary">Save rate</button><a class="btn ghost" href="{% url 'rate_list' %}">Cancel</a></div>
  </form>
  <script src="{% static 'js/reveal.js' %}?v={{ asset_v }}" defer></script>
{% endblock %}
