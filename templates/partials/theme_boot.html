<script>
  /* Light is the default. Dark and the top menu are used only if the user switched to them with the toggles. */
  (function () {
    var theme = "light", nav = "side";
    try {
      if (localStorage.getItem("theme") === "dark") { theme = "dark"; }
      if (localStorage.getItem("nav") === "top") { nav = "top"; }
    } catch (e) {}
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.setAttribute("data-nav", nav);
  })();
</script>
