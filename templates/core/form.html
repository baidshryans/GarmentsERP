{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <div class="page-head"><h1 class="page-title">{{ title }}</h1></div>
  <div class="island" style="max-width:640px">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form_errors.html" %}
      {% for field in form %}{% include "partials/field.html" %}{% endfor %}
      <div class="form-actions">
        <button class="btn primary">Save</button>
        <a class="btn ghost" href="javascript:history.back()">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
